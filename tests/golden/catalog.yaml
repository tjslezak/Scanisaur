  - name: proj.web.downloads
    rows: 3506114474210
    bytes: 1378507468714688
    partitioning: {column: timestamp, granularity: DAY}
    clustering: [project]
    columns:
      timestamp: TIMESTAMP
      project: STRING
      country_code: STRING
  - name: proj.web.daily_sample
    rows: 180000
    bytes: 13500000
    partitioning: {column: day, granularity: DAY}
    clustering: [sku]
    columns:
      day: DATE
      sku: STRING
      units: INT64
  - name: proj.web.scores
    rows: 900000000
    bytes: 40000000000
    partitioning: {column: bucket, granularity: RANGE}
    columns:
      bucket: INT64
      score: FLOAT64
  - name: proj.web.packages
    rows: 21944630783
    bytes: 12673694921272
    partitioning: {column: snapshot_at, granularity: DAY}
    clustering: [system, name, version]
    columns:
      snapshot_at: TIMESTAMP
      system: STRING
      name: STRING
      version: STRING
      licenses: STRING
  - name: proj.web.store_sales
    rows: 400000
    bytes: 52000000
    clustering: [region, store]
    columns:
      region: STRING
      store: STRING
      amount: NUMERIC
