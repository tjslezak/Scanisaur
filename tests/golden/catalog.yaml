# Catalog shared by the golden cases. Changing it changes many expected outputs.
default_project: proj
default_dataset: analytics
tables:
  - name: proj.analytics.events
    rows: 1200000000
    bytes: 2100000000000
    partitioning: {column: event_date, granularity: DAY}
    clustering: [user_id]
    columns:
      event_date: DATE
      event_ts: TIMESTAMP
      user_id: STRING
      event_name: STRING
      params: ARRAY<STRUCT<key STRING, value STRING>>
      device: STRUCT<category STRING, os STRING>
  - name: proj.analytics.users
    rows: 5000000
    bytes: 900000000
    columns:
      user_id: STRING
      country: STRING
      signup_date: DATE
  - name: proj.analytics.Orders
    rows: 80000000
    bytes: 12000000000
    partitioning: {column: order_date, granularity: DAY, required: true}
    columns:
      order_id: STRING
      user_id: STRING
      amount: NUMERIC
      order_date: DATE
  - name: proj.ga4.events_*
    rows: 900000000
    bytes: 750000000000
    columns:
      event_name: STRING
      user_pseudo_id: STRING
      event_timestamp: INT64
  - name: proj.raw.ingest
    rows: 40000000
    bytes: 60000000000
    partitioning: {granularity: DAY}
    columns:
      payload: STRING
  # Shaped like the benchmark's public tables (issue #10), for SCN003 and SCN004.
  - name: proj.web.pageviews
    rows: 70000000000
    bytes: 2970000000000
    partitioning: {column: datehour, granularity: DAY, required: true}
    clustering: [wiki, title]
    columns:
      datehour: TIMESTAMP
      wiki: STRING
      title: STRING
      views: INT64
  - name: proj.web.trends
    rows: 43974000
    bytes: 3203450686
    partitioning: {column: refresh_date, granularity: DAY}
    columns:
      refresh_date: DATE
      week: DATE
      dma_name: STRING
      term: STRING
      score: INT64
      rank: INT64
    # The last 30 days, as Google Trends keeps them; the estimate reads these sizes.
    partitions:
      "20260902": 106781689
      "20260903": 106781689
      "20260904": 106781689
      "20260905": 106781689
      "20260906": 106781689
      "20260907": 106781689
