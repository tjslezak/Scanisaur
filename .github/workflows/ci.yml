name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:  # run by release.yml before publishing

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - name: Reject committed private keys
        run: uv run pre-commit run detect-private-key --all-files

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Every supported Python on Linux; macOS only on the oldest and newest
        # stable ones. 3.15 has no pydantic-core wheels yet, so it builds from
        # source on a cache miss; keep it off macOS until the wheels exist.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.14"
          # Coverage is measured, and its fail_under gate enforced, once.
          - os: ubuntu-latest
            python-version: "3.14"
            coverage: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # Only a lockfile change should drop the cache (and rebuild 3.15's
          # pydantic-core), not every pyproject.toml edit.
          cache-dependency-glob: uv.lock
      - run: uv sync --locked
      - if: matrix.coverage
        run: uv run pytest --cov
      - if: ${{ !matrix.coverage }}
        run: uv run pytest

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
