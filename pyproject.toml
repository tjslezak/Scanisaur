[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "scanisaur"
version = "0.0.1"
description = "Schema-aware pre-flight checks for AI-agent SQL, using warehouse metadata only."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Scanisaur contributors" }]
keywords = ["mcp", "sql", "bigquery", "data-warehouse", "ai-agents", "query-optimization"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3,<2.4",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "sqlglot>=30.21,<31",
    "typer>=0.15",
]

[project.urls]
Homepage = "https://github.com/tjslezak/Scanisaur"
Issues = "https://github.com/tjslezak/Scanisaur/issues"

[project.scripts]
scanisaur = "scanisaur.__main__:main"

[dependency-groups]
dev = [
  "mypy>=2.3",
  "pre-commit>=4.6",
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "ruff>=0.16",
  "types-pyyaml>=6.0.12.20260906",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scanisaur"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "PT", "RUF", "SIM", "UP", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["scanisaur"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
