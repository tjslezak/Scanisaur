# PyPI downloads: partition filter optional, clustered by project, 1.4 PB.
- id: pypi-one-day-one-project
  sql: >-
    SELECT COUNT(*) FROM `bigquery-public-data.pypi.file_downloads`
    WHERE DATE(timestamp) = '2026-09-28' AND project = 'requests'
- id: pypi-lower-project
  expect: [SCN004]
  sql: >-
    SELECT COUNT(*) FROM `bigquery-public-data.pypi.file_downloads`
    WHERE DATE(timestamp) = '2026-09-28' AND LOWER(project) = 'requests'
- id: pypi-no-partition-filter
  expect: [SCN003]
  sql: >-
    SELECT country_code, COUNT(*) AS n FROM `bigquery-public-data.pypi.file_downloads`
    WHERE project = 'requests' GROUP BY country_code
- id: pypi-last-week
