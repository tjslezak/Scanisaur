# Queries for the dry-run benchmark (issue #10). Each is dry-run against BigQuery and
# checked by Scanisaur. `expect` lists the rules that should fire, from SCN003, SCN004,
# SCN005, SCN006, SCN007, SCN008, SCN009 and SCN011; an empty list means the query should pass. Traps and their fixes
# come in pairs, after the patterns in issue #10.
#
# Rolling tables (Trends, deps.dev, PyPI) are queried at fixed days they keep, or
# relative to CURRENT_DATE(), so the queries stay valid as new partitions arrive.

# Google Trends: partition filter optional, not clustered, about 40 daily snapshots.
- id: trends-one-day
  expect: [SCN009]
  sql: >-
    SELECT term, rank FROM `bigquery-public-data.google_trends.top_terms`
    WHERE refresh_date = DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY)
- id: trends-no-filter
  expect: [SCN003, SCN009]
  sql: SELECT term, rank FROM `bigquery-public-data.google_trends.top_terms`
- id: trends-week-instead-of-refresh-date
  expect: [SCN003]
  sql: >-
    SELECT term, rank FROM `bigquery-public-data.google_trends.top_terms`
    WHERE week = DATE_SUB(DATE_TRUNC(CURRENT_DATE(), WEEK), INTERVAL 14 DAY) AND rank <= 5
- id: trends-week-and-refresh-date
  sql: >-
    SELECT term, rank FROM `bigquery-public-data.google_trends.top_terms`
    WHERE week = DATE_SUB(DATE_TRUNC(CURRENT_DATE(), WEEK), INTERVAL 14 DAY) AND rank <= 5
    AND refresh_date = DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY)
- id: trends-last-week
  sql: >-
    SELECT term, score FROM `bigquery-public-data.google_trends.top_terms`
    WHERE refresh_date >= DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)
- id: trends-range-of-days
  expect: [SCN009]
  sql: >-
    SELECT dma_name, term FROM `bigquery-public-data.google_trends.top_terms`
    WHERE refresh_date BETWEEN DATE_SUB(CURRENT_DATE(), INTERVAL 14 DAY)
    AND DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY)
- id: trends-two-days-in-list
  expect: [SCN009]
  sql: >-
    SELECT term FROM `bigquery-public-data.google_trends.top_terms`
    WHERE refresh_date IN (DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY),
    DATE_SUB(CURRENT_DATE(), INTERVAL 9 DAY))
- id: trends-cast-to-string
  expect: [SCN004]
  sql: >-
    SELECT term FROM `bigquery-public-data.google_trends.top_terms`
    WHERE CAST(refresh_date AS STRING) = FORMAT_DATE('%Y-%m-%d', DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY))
- id: trends-extract-month
  expect: [SCN004]
  sql: >-
    SELECT term FROM `bigquery-public-data.google_trends.top_terms`
    WHERE EXTRACT(MONTH FROM refresh_date) = EXTRACT(MONTH FROM CURRENT_DATE())
- id: trends-date-trunc-week
  expect: [SCN009]
  sql: >-
    SELECT term FROM `bigquery-public-data.google_trends.top_terms`
    WHERE DATE_TRUNC(refresh_date, WEEK) = DATE_TRUNC(DATE_SUB(CURRENT_DATE(), INTERVAL 7 DAY), WEEK)
- id: trends-preview
  sql: >-
    SELECT * FROM `bigquery-public-data.google_trends.top_terms`
    WHERE refresh_date = DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY) LIMIT 10
- id: trends-preview-every-partition
  expect: [SCN003, SCN005]
  sql: SELECT * FROM `bigquery-public-data.google_trends.top_terms` LIMIT 10
- id: trends-star-except
  expect: [SCN003, SCN005, SCN009]
  sql: SELECT * EXCEPT (dma_id) FROM `bigquery-public-data.google_trends.top_terms`
- id: trends-limit-zero
  sql: SELECT * FROM `bigquery-public-data.google_trends.top_terms` LIMIT 0
- id: trends-count-star
  sql: SELECT COUNT(*) FROM `bigquery-public-data.google_trends.top_terms`
- id: trends-group-by
  sql: >-
    SELECT dma_name, COUNT(*) AS n FROM `bigquery-public-data.google_trends.top_terms`
    WHERE refresh_date = DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY) GROUP BY dma_name
- id: trends-having-on-partition-column
  sql: >-
    SELECT refresh_date, COUNT(*) AS n FROM `bigquery-public-data.google_trends.top_terms`
    GROUP BY refresh_date HAVING refresh_date = DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY)
- id: trends-cte-read-twice
  sql: >-
    WITH day AS (SELECT term, rank, score FROM `bigquery-public-data.google_trends.top_terms`
    WHERE refresh_date = DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY))
    SELECT a.term, b.score FROM day AS a JOIN day AS b ON a.term = b.term AND a.rank = b.rank
- id: trends-self-join-two-days
  sql: >-
    SELECT a.term FROM `bigquery-public-data.google_trends.top_terms` AS a
    JOIN `bigquery-public-data.google_trends.top_terms` AS b ON a.term = b.term
    WHERE a.refresh_date = DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY)
    AND b.refresh_date = DATE_SUB(CURRENT_DATE(), INTERVAL 9 DAY)
- id: trends-union-of-days
  expect: [SCN009]
  sql: >-
    SELECT term FROM `bigquery-public-data.google_trends.top_terms`
    WHERE refresh_date = DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY)
    UNION ALL SELECT term FROM `bigquery-public-data.google_trends.top_terms`
    WHERE refresh_date = DATE_SUB(CURRENT_DATE(), INTERVAL 3 DAY)

# Wikipedia pageviews 2025: partition filter required, clustered by wiki, title.
- id: pageviews-one-article
  sql: >-
    SELECT SUM(views) FROM `bigquery-public-data.wikipedia.pageviews_2025`
    WHERE DATE(datehour) = '2025-06-01' AND wiki = 'en' AND title = 'Python_(programming_language)'
- id: pageviews-title-without-wiki
  expect: [SCN011]
  sql: >-
    SELECT SUM(views) FROM `bigquery-public-data.wikipedia.pageviews_2025`
    WHERE DATE(datehour) = '2025-06-01' AND title = 'Python_(programming_language)'
- id: pageviews-lower-title
  expect: [SCN004]
  sql: >-
    SELECT SUM(views) FROM `bigquery-public-data.wikipedia.pageviews_2025`
    WHERE DATE(datehour) = '2025-06-01' AND wiki = 'en' AND LOWER(title) = 'python_(programming_language)'
- id: pageviews-no-partition-filter
  expect: [SCN003]
  sql: >-
    SELECT SUM(views) FROM `bigquery-public-data.wikipedia.pageviews_2025`
    WHERE wiki = 'en' AND title = 'Python_(programming_language)'
- id: pageviews-cast-datehour
  expect: [SCN004]
  sql: >-
    SELECT SUM(views) FROM `bigquery-public-data.wikipedia.pageviews_2025`
    WHERE CAST(datehour AS STRING) LIKE '2025-06-01%' AND wiki = 'en'
- id: pageviews-open-ended-range
  sql: >-
    SELECT SUM(views) FROM `bigquery-public-data.wikipedia.pageviews_2025`
    WHERE datehour >= '2025-12-01' AND wiki = 'en' AND title = 'Python_(programming_language)'
- id: pageviews-timestamp-trunc
  sql: >-
    SELECT SUM(views) FROM `bigquery-public-data.wikipedia.pageviews_2025`
    WHERE TIMESTAMP_TRUNC(datehour, DAY) = TIMESTAMP '2025-06-01' AND wiki = 'en'
    AND title = 'Python_(programming_language)'
- id: pageviews-hours-of-one-day
  sql: >-
    SELECT SUM(views) FROM `bigquery-public-data.wikipedia.pageviews_2025`
    WHERE datehour BETWEEN '2025-06-01 00:00:00' AND '2025-06-01 23:59:59'
    AND wiki = 'en' AND title = 'Python_(programming_language)'
- id: pageviews-top-titles-week
  sql: >-
    SELECT title, SUM(views) AS views FROM `bigquery-public-data.wikipedia.pageviews_2025`
    WHERE DATE(datehour) BETWEEN '2025-06-01' AND '2025-06-07' AND wiki = 'de'
    GROUP BY title ORDER BY views DESC LIMIT 10
- id: pageviews-by-wiki
  sql: >-
    SELECT wiki, SUM(views) AS views FROM `bigquery-public-data.wikipedia.pageviews_2025`
    WHERE DATE(datehour) = '2025-06-01' GROUP BY wiki
- id: pageviews-preview
  expect: [SCN005]
  sql: >-
    SELECT * FROM `bigquery-public-data.wikipedia.pageviews_2025`
    WHERE DATE(datehour) = '2025-06-01' LIMIT 10
- id: pageviews-extract-date
  sql: >-
    SELECT SUM(views) FROM `bigquery-public-data.wikipedia.pageviews_2025`
    WHERE EXTRACT(DATE FROM datehour) = '2025-06-01' AND wiki = 'en'

