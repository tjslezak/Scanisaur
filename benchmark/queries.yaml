# GA4 sample: 92 daily shards, not partitioned.
- id: ga4-first-week
  sql: >-
    SELECT COUNT(*) FROM `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*`
    WHERE _TABLE_SUFFIX BETWEEN '20210101' AND '20210107' AND event_name = 'purchase'
- id: ga4-event-date-instead-of-suffix
  expect: [SCN003]
  sql: >-
    SELECT COUNT(*) FROM `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*`
    WHERE event_date BETWEEN '20210101' AND '20210107' AND event_name = 'purchase'
- id: ga4-suffix-like
  sql: >-
    SELECT event_name, COUNT(*) AS n FROM `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*`
    WHERE _TABLE_SUFFIX LIKE '202012%' GROUP BY event_name
- id: ga4-narrower-wildcard
  sql: >-
    SELECT COUNT(*) FROM `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_202101*`
    WHERE event_name = 'purchase'
- id: ga4-parse-date-suffix
  sql: >-
    SELECT COUNT(DISTINCT user_pseudo_id) FROM `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*`
    WHERE PARSE_DATE('%Y%m%d', _TABLE_SUFFIX) >= '2021-01-25'
- id: ga4-preview-one-shard
  sql: >-
    SELECT * FROM `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*`
    WHERE _TABLE_SUFFIX = '20210131' LIMIT 10
- id: ga4-preview-every-shard
  expect: [SCN003, SCN005]
  sql: SELECT * FROM `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*` LIMIT 10
- id: ga4-struct-field
  sql: >-
    SELECT device.category, COUNT(*) AS n FROM `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*`
    WHERE _TABLE_SUFFIX BETWEEN '20210101' AND '20210131' GROUP BY device.category
- id: ga4-suffix-not-equal
  expect: [SCN003]
  sql: >-
    SELECT event_name FROM `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*`
    WHERE _TABLE_SUFFIX != '20210131'
- id: ga4-suffix-from-format-date
  sql: >-
    SELECT COUNT(*) FROM `bigquery-public-data.ga4_obfuscated_sample_ecommerce.events_*`
    WHERE _TABLE_SUFFIX BETWEEN FORMAT_DATE('%Y%m%d', DATE '2021-01-01') AND '20210107'

# theLook: small tables, not partitioned.
- id: thelook-order-totals
  sql: >-
    SELECT o.order_id, SUM(i.sale_price) AS total FROM `bigquery-public-data.thelook_ecommerce.orders` AS o
    JOIN `bigquery-public-data.thelook_ecommerce.order_items` AS i ON i.order_id = o.order_id
    GROUP BY o.order_id
- id: thelook-users-preview
  sql: SELECT * FROM `bigquery-public-data.thelook_ecommerce.users` LIMIT 10
- id: thelook-events-preview
  sql: SELECT * FROM `bigquery-public-data.thelook_ecommerce.events` LIMIT 10
- id: thelook-monthly-average
  sql: >-
    SELECT FORMAT_DATE('%Y-%m', DATE(created_at)) AS month, AVG(sale_price) AS average
    FROM `bigquery-public-data.thelook_ecommerce.order_items` GROUP BY month
- id: thelook-orders-by-country
  sql: >-
    SELECT u.country, COUNT(*) AS orders FROM `bigquery-public-data.thelook_ecommerce.users` AS u
    JOIN `bigquery-public-data.thelook_ecommerce.orders` AS o ON o.user_id = u.id GROUP BY u.country

# Joins that pair every row with every row (SCN006, #23).
- id: thelook-join-forgotten-key
  expect: [SCN006]
  sql: >-
    SELECT COUNT(*) FROM `bigquery-public-data.thelook_ecommerce.users` AS u,
    `bigquery-public-data.thelook_ecommerce.orders` AS o WHERE o.status = 'Complete'
- id: thelook-cross-join
  expect: [SCN006]
  sql: >-
    SELECT SUM(u.age * o.num_of_item) FROM `bigquery-public-data.thelook_ecommerce.users` AS u
    CROSS JOIN `bigquery-public-data.thelook_ecommerce.orders` AS o
- id: thelook-join-inequality-only
  expect: [SCN006]
  sql: >-
    SELECT COUNT(*) FROM `bigquery-public-data.thelook_ecommerce.users` AS u
    JOIN `bigquery-public-data.thelook_ecommerce.orders` AS o ON o.created_at < u.created_at
- id: thelook-join-connected-later
  sql: >-
    SELECT COUNT(*) FROM `bigquery-public-data.thelook_ecommerce.users` AS u,
    `bigquery-public-data.thelook_ecommerce.orders` AS o,
    `bigquery-public-data.thelook_ecommerce.order_items` AS i
    WHERE i.order_id = o.order_id AND i.user_id = u.id
- id: thelook-join-or-of-keys
  sql: >-
    SELECT COUNT(*) FROM `bigquery-public-data.thelook_ecommerce.users` AS u
    JOIN `bigquery-public-data.thelook_ecommerce.orders` AS o ON o.user_id = u.id OR o.order_id = u.id
- id: thelook-large-cross-join
  expect: [SCN006]
  sql: >-
    SELECT SUM(e.sequence_number * u.age) FROM `bigquery-public-data.thelook_ecommerce.events` AS e
    CROSS JOIN `bigquery-public-data.thelook_ecommerce.users` AS u

# Joins on columns that aren't a unique key, which repeat rows a sum or count then counts
# again (SCN007). thelook declares no keys; tables.yaml gives them.
- id: thelook-items-ordered-repeated
  expect: [SCN007]
  sql: >-
    SELECT SUM(o.num_of_item) AS items FROM `bigquery-public-data.thelook_ecommerce.orders` AS o
    JOIN `bigquery-public-data.thelook_ecommerce.order_items` AS i ON i.order_id = o.order_id WHERE i.status = 'Complete'
- id: thelook-items-ordered
  sql: >-
    SELECT SUM(o.num_of_item) AS items FROM `bigquery-public-data.thelook_ecommerce.orders` AS o
    WHERE o.order_id IN (SELECT order_id FROM `bigquery-public-data.thelook_ecommerce.order_items` WHERE status = 'Complete')
- id: thelook-orders-counted-per-item
  expect: [SCN007]
  sql: >-
    SELECT u.country, COUNT(o.order_id) AS orders FROM `bigquery-public-data.thelook_ecommerce.users` AS u
    JOIN `bigquery-public-data.thelook_ecommerce.orders` AS o ON o.user_id = u.id
    JOIN `bigquery-public-data.thelook_ecommerce.order_items` AS i ON i.order_id = o.order_id
    WHERE i.sale_price > 100 GROUP BY u.country
- id: thelook-orders-counted-distinct
  sql: >-
    SELECT u.country, COUNT(DISTINCT o.order_id) AS orders FROM `bigquery-public-data.thelook_ecommerce.users` AS u
    JOIN `bigquery-public-data.thelook_ecommerce.orders` AS o ON o.user_id = u.id
    JOIN `bigquery-public-data.thelook_ecommerce.order_items` AS i ON i.order_id = o.order_id
    WHERE i.sale_price > 100 GROUP BY u.country
- id: thelook-age-weighted-by-events
  expect: [SCN007]
  sql: >-
    SELECT AVG(u.age) AS average_age FROM `bigquery-public-data.thelook_ecommerce.users` AS u
    JOIN `bigquery-public-data.thelook_ecommerce.events` AS e ON e.user_id = u.id WHERE e.event_type = 'purchase'
- id: thelook-age-of-buyers
  sql: >-
    SELECT AVG(u.age) AS average_age FROM `bigquery-public-data.thelook_ecommerce.users` AS u
    WHERE u.id IN (SELECT user_id FROM `bigquery-public-data.thelook_ecommerce.events` WHERE event_type = 'purchase')
- id: thelook-items-joined-on-user
  expect: [SCN007]
  sql: >-
    SELECT o.order_id, i.product_id FROM `bigquery-public-data.thelook_ecommerce.orders` AS o
    JOIN `bigquery-public-data.thelook_ecommerce.order_items` AS i ON i.user_id = o.user_id
- id: thelook-items-joined-on-order
  sql: >-
    SELECT o.order_id, i.product_id FROM `bigquery-public-data.thelook_ecommerce.orders` AS o
    JOIN `bigquery-public-data.thelook_ecommerce.order_items` AS i ON i.order_id = o.order_id

