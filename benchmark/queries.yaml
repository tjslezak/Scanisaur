# Mixes: a required and an optional table in one query.
- id: mix-trending-articles
  sql: >-
    WITH top AS (SELECT DISTINCT term FROM `bigquery-public-data.google_trends.top_terms`
    WHERE refresh_date = DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY) AND rank <= 5)
    SELECT p.title, SUM(p.views) AS views FROM `bigquery-public-data.wikipedia.pageviews_2025` AS p
    JOIN top ON p.title = top.term WHERE DATE(p.datehour) = '2025-12-01' AND p.wiki = 'en'
    GROUP BY p.title
- id: mix-trends-unfiltered
  expect: [SCN003]
  sql: >-
    WITH top AS (SELECT DISTINCT term FROM `bigquery-public-data.google_trends.top_terms` WHERE rank <= 5)
    SELECT p.title, SUM(p.views) AS views FROM `bigquery-public-data.wikipedia.pageviews_2025` AS p
    JOIN top ON p.title = top.term WHERE DATE(p.datehour) = '2025-12-01' AND p.wiki = 'en'
    GROUP BY p.title
- id: mix-pageviews-unfiltered
  expect: [SCN003]
  sql: >-
    WITH top AS (SELECT DISTINCT term FROM `bigquery-public-data.google_trends.top_terms`
    WHERE refresh_date = DATE_SUB(CURRENT_DATE(), INTERVAL 2 DAY) AND rank <= 5)
    SELECT p.title, SUM(p.views) AS views FROM `bigquery-public-data.wikipedia.pageviews_2025` AS p
    JOIN top ON p.title = top.term WHERE p.wiki = 'en' GROUP BY p.title
